name: docker

on:
  push:
    paths:
      - "src-tauri/backend/Dockerfile"
      - "src-tauri/backend/.dockerignore"
      - "src-tauri/backend/main.py"
      - "src-tauri/backend/requirements.txt"
      - "src-tauri/backend/tests/**"
      - "docker-compose.yml"
      - "docker-compose.gpu.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "src-tauri/backend/Dockerfile"
      - "src-tauri/backend/.dockerignore"
      - "src-tauri/backend/main.py"
      - "src-tauri/backend/requirements.txt"
      - "src-tauri/backend/tests/**"
      - "docker-compose.yml"
      - "docker-compose.gpu.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

jobs:
  compose-and-dockerfile:
    name: lint compose / Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Dockerfile syntax check
        run: |
          docker buildx build --check -f src-tauri/backend/Dockerfile src-tauri/backend

      - name: Python syntax of backend entrypoint
        run: python3 -m py_compile src-tauri/backend/main.py src-tauri/backend/start_backend.py

      - name: Backend unit tests
        run: |
          python3 -m pip install --quiet fastapi uvicorn python-multipart pydantic python-dotenv pytest httpx
          python3 -m pytest src-tauri/backend/tests -q
